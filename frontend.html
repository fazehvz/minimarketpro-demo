<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MinimarketPro — Demo comercial</title>
<style>
:root{--blue:#2457d6;--blue2:#eaf0ff;--ink:#142033;--muted:#6c788c;--bg:#f5f7fb;--card:#fff;--line:#e5e9f1;--ok:#16834b;--warn:#c77800;--danger:#c93645;--shadow:0 8px 25px rgba(25,42,70,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:20px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{font-size:23px;font-weight:800;padding:8px 12px 24px}.brand span{color:var(--blue)}
.demo{margin:0 10px 18px;padding:10px 12px;background:#f1f5ff;border:1px solid #dce5ff;border-radius:12px;font-size:12px;color:#48608c}
.nav{display:grid;gap:4px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#41506a}.nav button:hover,.nav button.active{background:var(--blue2);color:var(--blue);font-weight:700}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}
.top small{color:var(--muted)}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:27px}.head p{margin:5px 0 0;color:var(--muted)}
.primary{background:var(--blue);color:#fff;padding:11px 16px;border-radius:9px;font-weight:700}.secondary{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:9px}.danger{background:#fff1f2;color:var(--danger);padding:9px 12px;border-radius:8px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.cols2{grid-template-columns:1.45fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.kpi .label{font-size:13px;color:var(--muted)}.kpi .num{font-size:25px;font-weight:800;margin-top:8px}.kpi .hint{font-size:12px;margin-top:7px;color:var(--ok)}
.section-title{font-size:17px;font-weight:800;margin:0 0 14px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.alert{padding:12px;border-radius:10px;margin-bottom:9px;background:#fff8ea}.alert strong{display:block}.alert small{color:var(--muted)}.alert.d{background:#fff0f2}.alert.o{background:#eef9f3}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:700}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f8}.pill.ok{background:#eaf8f0;color:var(--ok)}.pill.warn{background:#fff3df;color:var(--warn)}.pill.bad{background:#ffedf0;color:var(--danger)}
.bar{height:10px;background:#edf0f5;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;outline:none}.search:focus{border-color:#aabcf4}
.pos{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.product{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left}.product:hover{border-color:#a9baf0;transform:translateY(-1px)}.product .name{font-weight:700}.product .meta{font-size:12px;color:var(--muted);margin:6px 0}.price{font-weight:800;font-size:18px}.cart-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:5px;align-items:center}.qty button{width:27px;height:27px;border-radius:7px;background:#edf1f8}.totals{margin-top:15px;display:grid;gap:8px}.total{font-size:22px;font-weight:900}
.chart{display:flex;align-items:end;gap:12px;height:190px;padding:10px 4px}.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}.vbar i{width:100%;max-width:38px;border-radius:7px 7px 2px 2px;background:var(--blue)}.vbar span{font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(12,22,40,.42);display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;width:min(560px,92vw);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modalbox h3{margin-top:0}.choice{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}.choice:hover{border-color:#9eb3ef;background:#f7f9ff}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.toast{position:fixed;right:22px;bottom:22px;background:#142033;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:30;box-shadow:var(--shadow)}.toast.show{display:block}
.feature{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.feature div{padding:12px;border:1px solid var(--line);border-radius:10px}.feature b{display:block;margin-bottom:4px}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.cols2,.pos{grid-template-columns:1fr}.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}
@media(max-width:720px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.top{padding:0 16px}.content{padding:16px}.kpis,.cols3,.products,.feature,.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Minimarket<span>Pro</span></div>
  <div class="demo">DEMO COMERCIAL<br><b>Datos de prueba</b> · No afecta una tienda real</div>
  <nav class="nav" id="nav">
    <button data-page="inicio" class="active">⌂ &nbsp; Inicio</button>
    <button data-page="vender">▣ &nbsp; Vender</button>
    <button data-page="productos">▤ &nbsp; Productos</button>
    <button data-page="inventario">▥ &nbsp; Inventario</button>
    <button data-page="compras">↓ &nbsp; Compras</button>
    <button data-page="proveedores">♙ &nbsp; Proveedores</button>
    <button data-page="cuentas">S/ &nbsp; Por pagar</button>
    <button data-page="promociones">◇ &nbsp; Promociones</button>
    <button data-page="incidentes">! &nbsp; Incidencias</button>
    <button data-page="reportes">◒ &nbsp; Reportes</button>
    <button data-page="migracion">⇄ &nbsp; Migración</button>
    <button data-page="configuracion">⚙ &nbsp; Configuración</button>
    <button data-page="diferencias">★ &nbsp; Diferencias</button>
  </nav>
</aside>
<main class="main">
<header class="top"><div><b>Minimarket Central</b><br><small>Demo comercial · Operación simulada</small></div><div>Administrador ▾</div></header>
<div class="content" id="view"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const state={
page:"inicio",cart:[],sales:18,stock:150,
products:[
{id:1,name:"Leche Gloria 1L",barcode:"7751271001012",price:4.90,stock:20,category:"Lácteos",lots:[["07/09/2026",8],["09/09/2026",12]]},
{id:2,name:"Panetón 900g",barcode:"7750182009001",price:24.50,stock:7,category:"Panadería",lots:[["15/11/2026",7]]},
{id:3,name:"Gaseosa Inca Kola 1.5L",barcode:"7750670001505",price:8.50,stock:18,category:"Bebidas",lots:[["20/10/2026",18]]},
{id:4,name:"Arroz Costeño 1kg",barcode:"7751045001018",price:4.20,stock:35,category:"Abarrotes",lots:[["18/01/2027",35]]},
{id:5,name:"Aceite Primor 1L",barcode:"7751295000101",price:9.80,stock:16,category:"Abarrotes",lots:[["11/12/2026",16]]},
{id:6,name:"Atún Florida 170g",barcode:"7751026001704",price:6.90,stock:22,category:"Conservas",lots:[["03/03/2028",22]]},
{id:7,name:"Huevos x15",barcode:"2000000000157",price:10.90,stock:12,category:"Frescos",lots:[["10/09/2026",12]]},
{id:8,name:"Galleta Soda 6un",barcode:"7750111000060",price:3.50,stock:20,category:"Snacks",lots:[["22/02/2027",20]]}
],
suppliers:[
{name:"Distribuidora Andina S.A.C.",ruc:"20601234567",phone:"999 111 222",debt:1840},
{name:"Comercial La Central E.I.R.L.",ruc:"20598765431",phone:"988 333 444",debt:620},
{name:"Abarrotes del Sur S.A.C.",ruc:"20455667788",phone:"977 555 666",debt:0}
],
incidents:[
{product:"Leche Gloria 1L",lot:"07/09/2026",qty:2,reason:"Envase dañado",status:"Reportada"},
{product:"Panetón 900g",lot:"15/11/2026",qty:1,reason:"Producto recibido equivocado",status:"En revisión"}
],
promos:[
{name:"2x1 Galleta Soda",type:"2x1",status:"Activa"},
{name:"Segundo Atún -20%",type:"Descuento",status:"Activa"},
{name:"Combo desayuno",type:"Combo",status:"Programada"}
],
payables:[
{supplier:"Distribuidora Andina S.A.C.",invoice:"F001-234",due:"08/09/2026",amount:1840,status:"Pendiente"},
{supplier:"Comercial La Central E.I.R.L.",invoice:"F001-882",due:"12/09/2026",amount:620,status:"Pendiente"}
]
};

const view=document.getElementById("view");
const modal=document.getElementById("modal");
const modalbox=document.getElementById("modalbox");
const toastEl=document.getElementById("toast");

function money(n){return "S/ "+n.toFixed(2)}
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2400)}
function setPage(p){state.page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));

function shell(title,sub,action=""){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function card(content,cls="card"){return `<section class="${cls}">${content}</section>`}

function render(){
const p=state.page;
const fn={inicio:home,vender:sell,productos:products,inventario:inventory,compras:purchases,proveedores:suppliers,cuentas:payables,promociones:promotions,incidentes:incidents,reportes:reports,migracion:migration,configuracion:settings,diferencias:differences}[p];
view.innerHTML=fn();
}

function home(){
return shell("Resumen del negocio","Todo lo importante de tu tienda, sin complicaciones.",`<button class="primary" onclick="setPage('vender')">+ Nueva venta</button>`)
+`<div class="grid kpis">
${card(`<div class="kpi"><div class="label">Ventas de hoy</div><div class="num">S/ 486.30</div><div class="hint">↑ 12.4% vs. ayer</div></div>`)}
${card(`<div class="kpi"><div class="label">Ventas realizadas</div><div class="num">${state.sales}</div><div class="hint">Operación normal</div></div>`)}
${card(`<div class="kpi"><div class="label">Stock disponible</div><div class="num">${state.products.reduce((a,p)=>a+p.stock,0)}</div><div class="hint">Unidades registradas</div></div>`)}
${card(`<div class="kpi"><div class="label">Por cobrar a clientes</div><div class="num">S/ 320.00</div><div class="hint">3 cuentas</div></div>`)}
${card(`<div class="kpi"><div class="label">Atención requerida</div><div class="num">5</div><div class="hint" style="color:var(--warn)">Revisar hoy</div></div>`)}
</div>
<div class="grid cols2" style="margin-top:16px">
${card(`<h3 class="section-title">Actividad reciente</h3>
<table class="table"><tr><td>Venta #00018<br><small class="muted">Hace 4 min · Efectivo</small></td><td><b>S/ 24.50</b></td></tr>
<tr><td>Venta #00017<br><small class="muted">Hace 11 min · Yape</small></td><td><b>S/ 42.00</b></td></tr>
<tr><td>Venta #00016<br><small class="muted">Hace 18 min · Tarjeta</small></td><td><b>S/ 18.90</b></td></tr>
<tr><td>${state.lastPayment?`Venta #${String(state.sales).padStart(5,"0")}<br><small class="muted">Última prueba · ${state.lastPayment.method}</small>`:`Recepción #R0007<br><small class="muted">Hace 31 min · 28 productos</small>`}</td><td><b>${state.lastPayment?money(state.lastPayment.total):"Compra"}</b></td></tr></table>`)}
${card(`<h3 class="section-title">Requiere atención</h3>
<div class="alert d"><strong>Leche Gloria</strong><small>Lote próximo a vencer · 07/09/2026</small></div>
<div class="alert"><strong>Panetón 900g</strong><small>Stock por debajo del mínimo · 7 unidades</small></div>
<div class="alert"><strong>Factura F001-234</strong><small>Vence en 2 días · S/ 1,840.00</small></div>
<div class="alert o"><strong>3 documentos</strong><small>Listos para revisión SUNAT (simulación)</small></div>`)}
</div>
<div class="grid cols3" style="margin-top:16px">
${card(`<h3 class="section-title">Ventas esta semana</h3><div class="chart">${[42,55,48,72,64,86,58].map((x,i)=>`<div class="vbar"><i style="height:${x*1.55}px"></i><span>${["L","M","X","J","V","S","D"][i]}</span></div>`).join("")}</div>`)}
${card(`<h3 class="section-title">Producto más vendido</h3><div style="font-size:24px;font-weight:900">Leche Gloria 1L</div><p class="muted">38 unidades esta semana</p><div class="bar"><i style="width:78%"></i></div><p class="muted">Rotación alta · sugerencia: revisar reposición</p>`)}
${card(`<h3 class="section-title">Asistente de voz</h3><p class="muted">Haz una consulta como si estuvieras atendiendo en caja.</p><button class="primary" onclick="voice()">🎙️ Consultar por voz</button><p class="muted" style="font-size:12px">Ejemplo: “¿Cuánto cuesta la leche Gloria?”</p>`)}
</div>`;
}

function sell(){
return shell("Vender","Venta rápida con búsqueda, código de barras y control de vencimiento.",`<button class="secondary" onclick="voice()">🎙️ Consultar</button>`)
+`<div class="pos"><div>
${card(`<div class="row"><input id="q" class="search" placeholder="Buscar producto o escanear código de barras..." oninput="filterProducts()"><button class="secondary" onclick="scan()">▣</button></div><div class="products" id="productGrid">${productCards(state.products)}</div>`)}
</div>
${card(`<div class="between"><h3 class="section-title">Venta actual</h3><span class="pill">${state.cart.length} productos</span></div><div id="cart">${cartHTML()}</div>
<div class="totals"><div class="between"><span>Subtotal</span><b>${money(cartTotal())}</b></div><div class="between"><span>Descuento</span><b>S/ 0.00</b></div><div class="between total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="primary" style="width:100%;margin-top:5px" onclick="checkout()">Cobrar ${money(cartTotal())}</button></div>`)}
</div>`;
}
function productCards(arr){return arr.map(p=>`<button class="product" onclick="chooseProduct(${p.id})"><div class="name">${p.name}</div><div class="meta">${p.category} · ${p.barcode}</div><div class="between"><span class="price">${money(p.price)}</span><span class="pill ${p.stock<8?'warn':'ok'}">${p.stock} und.</span></div></button>`).join("")||`<div class="empty">No se encontraron productos.</div>`}
function filterProducts(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("productGrid").innerHTML=productCards(state.products.filter(p=>(p.name+p.barcode+p.category).toLowerCase().includes(q)))}
function chooseProduct(id){const p=state.products.find(x=>x.id===id);if(p.lots.length>1){openLot(p)}else addCart(p,p.lots[0][0])}
function openLot(p){modalbox.innerHTML=`<h3>Seleccionar vencimiento</h3><p class="muted">${p.name} · ${p.stock} unidades disponibles</p>${p.lots.map((l,i)=>`<div class="choice" onclick="closeModal();addCartById(${p.id},'${l[0]}')"><span><b>${l[0]}</b><br><small>${l[1]} disponibles</small></span><span>Elegir ›</span></div>`).join("")}<button class="secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add("show")}
function addCartById(id,lot){const p=state.products.find(x=>x.id===id);addCart(p,lot)}
function addCart(p,lot){let x=state.cart.find(i=>i.id===p.id&&i.lot===lot);if(x)x.qty++;else state.cart.push({id:p.id,name:p.name,price:p.price,lot,qty:1});toast(`${p.name} agregado a la venta`);render()}
function cartTotal(){return state.cart.reduce((a,x)=>a+x.price*x.qty,0)}
function cartHTML(){return state.cart.length?state.cart.map((x,i)=>`<div class="cart-item"><div><b>${x.name}</b><br><small class="muted">Venc. ${x.lot} · ${money(x.price)}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div><b>${money(x.price*x.qty)}</b></div>`).join(""):`<div class="empty">Agrega productos para iniciar la venta.</div>`}
function changeQty(i,d){state.cart[i].qty+=d;if(state.cart[i].qty<=0)state.cart.splice(i,1);render()}
function checkout(){
if(!state.cart.length)return toast("Agrega al menos un producto");
showPaymentMethods();
}
function showPaymentMethods(){
modalbox.innerHTML=`<h3>Seleccionar método de pago</h3>
<p class="muted">Total de la venta: <b style="font-size:24px;color:var(--ink)">${money(cartTotal())}</b></p>
<div class="grid" style="gap:8px">
<button class="choice" onclick="payMethod('Efectivo')"><span>💵 <b>Efectivo</b><br><small>Indicar cuánto recibió el cajero y calcular vuelto</small></span><span>›</span></button>
<button class="choice" onclick="payMethod('Yape / Plin · QR')"><span>📱 <b>QR · Yape / Plin</b><br><small>Mostrar QR y esperar confirmación</small></span><span>›</span></button>
<button class="choice" onclick="payMethod('Tarjeta · Izipay')"><span>💳 <b>Tarjeta · POS Izipay</b><br><small>Enviar el importe al terminal y esperar resultado</small></span><span>›</span></button>
<button class="choice" onclick="payMethod('Mixto')"><span>↔ <b>Pago mixto</b><br><small>Combinar efectivo con QR o tarjeta</small></span><span>›</span></button>
</div>
<div class="alert o" style="margin-top:12px"><b>La venta aún NO está registrada</b><br><small>Primero se selecciona el método y se completa/valida el pago. Después se confirma la venta.</small></div>
<button class="secondary" onclick="closeModal()">Cancelar</button>`;
modal.classList.add("show")
}
function payMethod(method){
if(method==="Efectivo"){
modalbox.innerHTML=`<h3>💵 Pago en efectivo</h3>
<p>Total a cobrar: <b style="font-size:24px">${money(cartTotal())}</b></p>
<div class="field"><label>¿Cuánto recibió el cajero?</label><input id="cashReceived" type="number" min="0" step="0.10" placeholder="Ej. 50.00" oninput="calcChange()" autofocus></div>
<div class="choice" style="margin-top:12px"><span>Vuelto</span><b id="change">S/ 0.00</b></div>
<div id="cashError" class="alert d" style="display:none">El monto recibido es menor que el total.</div>
<div class="row" style="justify-content:flex-end;margin-top:15px">
<button class="secondary" onclick="showPaymentMethods()">Atrás</button>
<button class="primary" onclick="confirmCash()">Confirmar pago y registrar venta</button>
</div>
<p class="muted" style="font-size:12px">El sistema no debe registrar la venta hasta confirmar que el efectivo recibido cubre el total.</p>`;
modal.classList.add("show");
setTimeout(()=>document.getElementById("cashReceived")?.focus(),50);
calcChange();
}
else if(method==="Yape / Plin · QR"){
modalbox.innerHTML=`<h3>📱 Pago por QR · Yape / Plin</h3>
<p>Total a cobrar: <b style="font-size:24px">${money(cartTotal())}</b></p>
<div style="border:2px dashed #cbd5ea;border-radius:14px;padding:35px;text-align:center;margin:12px 0;font-size:42px">▦<br><small style="font-size:12px;color:var(--muted)">QR SIMULADO</small></div>
<div class="alert"><b>Esperando confirmación del pago</b><br><small>En la versión final, la venta se cerrará cuando la integración devuelva el pago aprobado.</small></div>
<div class="row" style="justify-content:flex-end">
<button class="secondary" onclick="showPaymentMethods()">Atrás</button>
<button class="primary" onclick="finishSale('QR · Yape / Plin')">Simular pago aprobado</button>
</div>`;
modal.classList.add("show");
}
else if(method==="Tarjeta · Izipay"){
modalbox.innerHTML=`<h3>💳 Pago con tarjeta · POS Izipay</h3>
<p>Total a enviar al terminal: <b style="font-size:24px">${money(cartTotal())}</b></p>
<div class="choice"><span><b>POS Izipay</b><br><small>Terminal del comercio</small></span><span class="pill ok">DEMO</span></div>
<div class="alert"><b>Flujo previsto</b><br><small>MinimarketPro envía el monto → el cliente paga en el POS → Izipay devuelve aprobado/rechazado → recién entonces se registra la venta.</small></div>
<div class="row" style="justify-content:flex-end">
<button class="secondary" onclick="showPaymentMethods()">Atrás</button>
<button class="primary" onclick="finishSale('Tarjeta · Izipay')">Simular tarjeta aprobada</button>
</div>`;
modal.classList.add("show");
}
else{
const half=(cartTotal()/2).toFixed(2);
modalbox.innerHTML=`<h3>↔ Pago mixto</h3>
<p>Total de la venta: <b style="font-size:24px">${money(cartTotal())}</b></p>
<div class="formgrid">

function calcChange(){
const el=document.getElementById("cashReceived");
const out=document.getElementById("change");
const err=document.getElementById("cashError");
if(el&&out){
const received=parseFloat(el.value||0);
const diff=received-cartTotal();
out.textContent=money(Math.max(0,diff));
if(err)err.style.display=(el.value!=="" && diff<0)?"block":"none";
}}
function confirmCash(){
const el=document.getElementById("cashReceived");
const received=parseFloat(el?.value||0);
if(!Number.isFinite(received)||received<cartTotal()){
toast("El efectivo recibido no cubre el total");
return;
}
finishSale('Efectivo');
}
function calcMixed(){
const a=parseFloat(document.getElementById("mixedCash")?.value||0);
const b=parseFloat(document.getElementById("mixedDigital")?.value||0);
const sum=a+b, diff=sum-cartTotal();
const s=document.getElementById("mixedSum"), d=document.getElementById("mixedDiff"), e=document.getElementById("mixedError");
if(s)s.textContent=money(sum);
if(d)d.textContent=money(Math.abs(diff));
if(e)e.style.display=Math.abs(diff)>0.009?"block":"none";
}
function confirmMixed(){
const a=parseFloat(document.getElementById("mixedCash")?.value||0);
const b=parseFloat(document.getElementById("mixedDigital")?.value||0);
if(!Number.isFinite(a)||!Number.isFinite(b)||Math.abs((a+b)-cartTotal())>0.009){
toast("El pago mixto debe sumar exactamente el total");
return;
}
finishSale('Mixto · efectivo + electrónico');
}

function finishSale(method){
if(!state.cart.length){toast("No hay productos en la venta");return;}
const total=cartTotal();
const items=state.cart.map(x=>({name:x.name,qty:x.qty,lot:x.lot}));
let insufficient=false;
for(const item of state.cart){
  const p=state.products.find(x=>x.id===item.id);
  const lot=p?.lots.find(l=>l[0]===item.lot);
  if(!p||!lot||lot[1]<item.qty){insufficient=true;break;}
}
if(insufficient){
  toast("No hay stock suficiente en el lote seleccionado");
  return;
}
for(const item of state.cart){
  const p=state.products.find(x=>x.id===item.id);
  const lot=p.lots.find(l=>l[0]===item.lot);
  lot[1]-=item.qty;
  p.stock-=item.qty;
}
state.sales++;
state.lastPayment={method,total,items,time:new Date().toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"})};
state.cart=[];
closeModal();
toast(`Pago confirmado · ${method} · ${money(total)} · Venta registrada`);
setPage("inicio");
}
